name: Build Mmodel APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are missing; publishing a debug APK instead."
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mmodel-release.keystore"

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          MMODEL_KEYSTORE_PATH: ${{ runner.temp }}/mmodel-release.keystore
          MMODEL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MMODEL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MMODEL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mmodel-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mmodel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            ASSET=app-release.apk
            NOTES="Signed Mmodel 1.4 release build from $GITHUB_SHA."
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
            ASSET=app-debug.apk
            NOTES="Debug Mmodel 1.4 build from $GITHUB_SHA. Add signing secrets to publish a signed release."
          fi

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          gh release view latest > /dev/null 2>&1 || \
            gh release create latest --title "Mmodel latest APK" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          gh release upload latest "$RUNNER_TEMP/$ASSET" --clobber

          if [ "$ASSET" = "app-release.apk" ]; then
            gh release delete-asset latest app-debug.apk --yes || true
          fi
